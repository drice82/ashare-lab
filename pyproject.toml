[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ashare-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "duckdb>=1.2,<2",
  "polars>=1.24,<2", "pyarrow>=19,<24", "numpy>=2.2,<3", "httpx>=0.28,<1",
  "cryptography>=44,<47", "apscheduler>=3.11,<4", "pypinyin>=0.55,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
ashare = "ashare_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ashare_lab"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["backend/src/ashare_lab"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
